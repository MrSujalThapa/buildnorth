name: CI

on:
  pull_request:
    branches: [main, feat/pass9-evidence-integrations]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check:architecture
      - run: npm run check:migrations
      - run: npm run seed-demo
      - name: Optional OpenAI baseline must fail closed while unconfigured
        shell: bash
        run: |
          set +e
          output=$(uv run python scripts/evaluate_openai_baseline.py 2>&1)
          status=$?
          test "$status" -eq 2
          grep -q 'not_executed' <<< "$output"
