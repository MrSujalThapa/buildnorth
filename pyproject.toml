[project]
name = "personal-markets-api"
version = "0.1.0"
description = "Personal Markets modular-monolith backend"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "composio>=0.15.0",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "joblib>=1.5,<2",
  "langgraph>=1.2.11",
  "langgraph-checkpoint-postgres>=3.1.2",
  "numpy>=2.2,<3",
  "openai>=1.100,<2",
  "openpyxl>=3.1.5",
  "pandas>=2.3,<3",
  "psycopg[binary,pool]>=3.3.4",
  "pyarrow>=25.0.1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.32",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "ruff>=0.12,<1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/personal_markets"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a migrated Postgres database"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "apps/api/tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"apps/api/src/personal_markets/persistence/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src", "apps/api/tests", "scripts"]
exclude = ["scripts/prepare_oulad.py"]

[[tool.mypy.overrides]]
module = ["joblib", "pandas", "scipy.*", "sklearn.*", "langgraph.*", "langgraph_checkpoint_postgres.*"]
ignore_missing_imports = true
