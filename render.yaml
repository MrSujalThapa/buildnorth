# Private staging API. Create this Blueprint from the Render dashboard after
# connecting GitHub repo MrSujalThapa/buildnorth. Do not paste secrets here.
services:
  - type: web
    name: playitout-staging-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: PM_ENVIRONMENT
        value: staging
      - key: PM_LOG_LEVEL
        value: INFO
      - key: PM_DEV_BOOTSTRAP_TEST_USERS
        value: "false"
      - key: PM_TEST_AUTH_SECRET
        value: ""
      - key: PM_DEV_DEMO_FIXTURES
        value: "false"
      - key: PM_HOSTED_INFERENCE_ENABLED
        value: "true"
      - key: PM_HOSTED_USER_QUOTA_USD
        value: "10.0"
      - key: PM_HOSTED_ADMIN_QUOTA_USD
        value: "100.0"
      - key: PM_HOSTED_GLOBAL_QUOTA_USD
        value: "250.0"
      - key: PM_HOSTED_USER_QUOTA_TOKENS
        value: "5000000"
      - key: PM_HOSTED_GLOBAL_QUOTA_TOKENS
        value: "250000000"
      - key: PM_OPENAI_MAX_COST_USD
        value: "100.0"
      - key: PM_OPENAI_DAILY_TOKEN_BUDGET_HIGH_VOLUME
        value: "100000000"
      - key: PM_OPENAI_DAILY_TOKEN_BUDGET_PREMIUM
        value: "100000000"
      - key: PM_INFERENCE_PROVIDER
        value: spur
      - key: PM_INFERENCE_MODEL
        value: spur-deepseek-v4-flash
      - key: PM_COMPOSIO_ENABLED
        value: "true"
      - key: PM_HOSTED_USER_RPM
        value: "20"
      - key: PM_HOSTED_IP_RPM
        value: "60"
      - key: PM_MCP_ENABLED
        value: "true"
      - key: PM_MCP_DYNAMIC_CLIENT_REGISTRATION
        value: "true"
      - key: PM_TRUST_FORWARDED_HEADERS
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Hosted Supabase session-mode Postgres. Do not point this at local :54322.
      - key: PM_DATABASE_URL
        sync: false
      - key: PM_PUBLIC_API_URL
        sync: false
      - key: PM_PUBLIC_WEB_URL
        sync: false
      - key: PM_CORS_ORIGINS
        sync: false
      - key: PM_CORS_ORIGIN_REGEX
        value: ""
      - key: PM_CLERK_JWKS_URL
        sync: false
      - key: PM_CLERK_ISSUER
        sync: false
      - key: PM_CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: PM_ADMIN_EMAILS
        sync: false
      - key: PM_ADMIN_CLERK_USER_IDS
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: PM_SPUR_API_KEY
        sync: false
      - key: PM_OPENAI_API_KEY
        sync: false
      - key: PM_BYOK_ENCRYPTION_KEYS
        sync: false
      - key: PM_BYOK_ACTIVE_KEY_ID
        value: v1
      - key: COMPOSIO_API_KEY
        sync: false
